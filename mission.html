<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission — Lunar Echoes</title>
  <meta name="description" content="Mission detail page for Lunar Echoes" />

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    }

        <a href="index.html#about" class="inline-flex items-center justify-center gap-2 h-9 w-9 sm:h-auto sm:w-auto hover:text-sky-400 transition">

  <footer class="border-t border-slate-800 py-10 text-center text-sm text-slate-400">
    <p>Lunar Echoes — NASA Space Apps Challenge 2026 · Maputo</p>
    <p class="mt-1">Built with data and images from NASA, ESA and ISRO</p>

  <script src="js/mission.js"></script>
