<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission — Lunar Echoes</title>
  <meta name="description" content="Mission detail page for Lunar Echoes" />

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Favicon -->
  <link rel="icon" href="assets/images/lunar-echoes-mark.svg" type="image/svg+xml" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-950 text-white font-sans">

  <!-- ========== HEADER ========== -->
  <header class="bg-slate-950/60 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-5 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/images/lunar-echoes-logo-dark.svg" alt="Lunar Echoes" class="h-14" />
      </a>
      <nav class="flex items-center gap-4 sm:gap-8 text-sm text-slate-300">
        <a href="index.html" class="hover:text-sky-400 transition">Home</a>
        <a href="index.html#missions" class="hover:text-sky-400 transition">Missions</a>
        <a href="index.html#timeline" class="hover:text-sky-400 transition">Timeline</a>
        <a href="index.html#about" class="hover:text-sky-400 transition">About</a>
      </nav>
    </div>
  </header>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="max-w-6xl mx-auto px-4 py-16">
    <div id="mission-content">
      <p class="text-slate-400">Loading mission…</p>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="border-t border-slate-800 py-10 text-center text-sm text-slate-400">
    <p>Lunar Echoes — NASA Space Apps Challenge 2026 · Maputo</p>
    <p class="mt-1">Built with official NASA open data</p>
  </footer>

  <!-- Scripts -->
  <script src="js/data-loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('mission-content');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        container.innerHTML = `
          <div class="text-center py-20">
            <p class="text-red-400 text-lg font-medium mb-4">No mission specified.</p>
            <a href="index.html#missions" class="text-sky-400 hover:underline">← Back to missions</a>
          </div>
        `;
        return;
      }

      let missions;
      try {
        missions = await loadMissions();
      } catch (error) {
        console.error(error);
        container.innerHTML = `
          <div class="text-center py-20">
            <p class="text-red-400 text-lg font-medium mb-4">Failed to load mission data.</p>
            <a href="index.html#missions" class="text-sky-400 hover:underline">← Back to missions</a>
          </div>
        `;
        return;
      }

      const mission = missions.find(m => m.id === id);

      if (!mission) {
        container.innerHTML = `
          <div class="text-center py-20">
            <p class="text-red-400 text-lg font-medium mb-4">Mission not found.</p>
            <a href="index.html#missions" class="text-sky-400 hover:underline">← Back to missions</a>
          </div>
        `;
        return;
      }

      // Build year range
      let yearRange;
      if (mission.end_year === null) {
        yearRange = `${mission.launch_year} – present`;
      } else if (mission.launch_year === mission.end_year) {
        yearRange = `${mission.launch_year}`;
      } else {
        yearRange = `${mission.launch_year} – ${mission.end_year}`;
      }

      // Images
      let imagesHtml = '';
      if (mission.images && mission.images.length > 0) {
        imagesHtml = mission.images.map(img => `
          <figure class="mb-8">
            <img src="${img.src}" alt="${img.alt}" class="w-full rounded-xl" loading="lazy" />
            <figcaption class="mt-2 text-sm text-slate-400">${img.alt} — ${img.credit}</figcaption>
          </figure>
        `).join('');
      }

      // Lists helper
      function listHtml(items) {
        if (!items || items.length === 0) return '<p class="text-slate-400">—</p>';
        return `<ul class="list-disc list-inside space-y-1 text-slate-300">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
      }

      // Sources
      let sourcesHtml = '';
      if (mission.sources && mission.sources.length > 0) {
        sourcesHtml = `
          <ul class="space-y-2">
            ${mission.sources.map(s => `
              <li>
                <a href="${s}" target="_blank" rel="noopener" class="text-sky-400 hover:underline break-all">${s}</a>
              </li>
            `).join('')}
          </ul>
        `;
      }

      container.innerHTML = `
        <a href="index.html#missions" class="inline-flex items-center gap-2 text-sky-400 hover:underline mb-10">
          ← Back to missions
        </a>

        <p class="text-sky-400 text-sm font-medium tracking-wide uppercase mb-2">
          ${mission.body} · ${yearRange}
        </p>
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-4">${mission.name}</h1>
        <p class="text-slate-400 mb-8">Status: ${mission.status}</p>

        ${imagesHtml}

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12 mt-12">
          <div class="lg:col-span-2 space-y-10">
            <section>
              <h2 class="text-xl font-semibold mb-3">Story</h2>
              <p class="text-slate-300 leading-relaxed">${mission.story}</p>
            </section>

            <section>
              <h2 class="text-xl font-semibold mb-3">Summary</h2>
              <p class="text-slate-300 leading-relaxed">${mission.summary}</p>
            </section>

            <section>
              <h2 class="text-xl font-semibold mb-3">Why it matters</h2>
              <p class="text-slate-300 leading-relaxed">${mission.why_it_matters}</p>
            </section>
          </div>

          <div class="space-y-8">
            <section>
              <h2 class="text-lg font-semibold mb-3">Location</h2>
              <p class="text-slate-300">${mission.location_description}</p>
            </section>

            <section>
              <h2 class="text-lg font-semibold mb-3">Technologies</h2>
              ${listHtml(mission.technologies)}
            </section>

            <section>
              <h2 class="text-lg font-semibold mb-3">Key discoveries</h2>
              ${listHtml(mission.key_discoveries)}
            </section>

            <section>
              <h2 class="text-lg font-semibold mb-3">Left behind</h2>
              ${listHtml(mission.left_behind)}
            </section>

            <section>
              <h2 class="text-lg font-semibold mb-3">Sources</h2>
              ${sourcesHtml}
            </section>
          </div>
        </div>
      `;

      // Update page title
      document.title = `${mission.name} — Lunar Echoes`;
    });
  </script>
</body>
</html>
